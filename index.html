<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F3A5F">
<meta name="mobile-web-app-capable" content="yes">
<title>인원현황 관리표</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<style>
:root{--navy:#1F3A5F;--navy2:#2C5282;--bg:#F3F5F8;--card:#fff;--line:#E2E8F0;--muted:#64748B;--txt:#1A202C;
--leave:#2B6CB0;--half:#4299E1;--early:#D69E2E;--late:#DD6B20;--out:#805AD5;--absent:#C53030;--ok:#2F855A;--sat:#2B6CB0;--hol:#C0392B}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,"Malgun Gothic","Noto Sans KR","Apple SD Gothic Neo",sans-serif;font-size:16px}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;font-size:16px}
.hidden{display:none!important}
header.top{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;padding:12px 16px 10px}
header.top .sub{font-size:13px;opacity:.8}
header.top h1{margin:2px 0 0;font-size:20px}
.back{background:none;border:0;color:#fff;font-size:22px;padding:0 10px 0 0;vertical-align:middle}
main{padding:12px 12px 96px}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.stat{background:var(--card);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:22px;color:var(--navy)}
.stat span{font-size:13px;color:var(--muted)}
.search{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:#fff}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0;scrollbar-width:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 16px;font-size:15px;min-height:44px;min-width:56px;color:var(--txt)}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.period{display:flex;align-items:center;justify-content:space-between;background:#fff;border-radius:12px;padding:6px;margin-bottom:8px}
.period button{border:0;background:#EDF2F7;border-radius:10px;width:52px;height:46px;font-size:18px}
.period b{font-size:15px}
.list .row{display:flex;align-items:center;justify-content:space-between;background:#fff;border-radius:12px;padding:14px;margin-bottom:8px;min-height:60px;border:0;width:100%;text-align:left}
.row .nm{font-size:17px;font-weight:700}
.row .meta{font-size:13px;color:var(--muted);margin-top:4px}
.row .rt{text-align:right;font-size:13px;color:var(--muted)}
.row .rt b{display:block;font-size:18px;color:var(--navy)}
.badge{display:inline-block;font-size:13px;padding:2px 8px;border-radius:999px;background:#EDF2F7;color:#2D3748;margin-right:4px}
.badge.alba{background:#FEF3C7;color:#92400E}.badge.f{background:#FCE7F3;color:#9D174D}.badge.m{background:#E0F2FE;color:#075985}
.badge.quit{background:#E2E8F0;color:#718096}
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom)}
nav.bottom button{border:0;background:none;padding:8px 0 10px;font-size:13px;color:var(--muted);min-height:58px}
nav.bottom button i{display:block;font-style:normal;font-size:20px}
nav.bottom button.on{color:var(--navy);font-weight:700}
nav.bottom .fab{position:relative}
nav.bottom .fab i{width:54px;height:54px;line-height:54px;border-radius:50%;background:#E07B24;color:#fff;font-size:30px;margin:-22px auto 0;box-shadow:0 3px 8px rgba(0,0,0,.2)}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sum .box{background:#F7FAFC;border-radius:10px;padding:10px;text-align:center}
.sum .box b{display:block;font-size:20px}
.sum .box span{font-size:14px;color:var(--muted)}
.sum .box small{display:block;font-size:13px;color:var(--muted)}
.big{font-size:26px!important;color:var(--navy)}
.rec{display:flex;align-items:center;gap:10px;padding:12px 4px;min-height:52px;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.rec .dt{width:92px;font-size:14px}
.rec .ty{font-size:13px;color:#fff;border-radius:6px;padding:3px 8px;min-width:44px;text-align:center}
.rec .rs{flex:1;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t-연차{background:var(--leave)}.t-반차{background:var(--half)}.t-조퇴{background:var(--early)}.t-지각{background:var(--late)}.t-외출{background:var(--out)}.t-결근{background:var(--absent)}
.sat{color:var(--sat)}.sun{color:var(--hol)}
.btn{border:0;border-radius:12px;padding:14px 16px;font-size:16px;background:#EDF2F7;color:var(--txt);width:100%;margin-top:8px}
.btn.pri{background:var(--navy);color:#fff}.btn.warn{background:#FED7D7;color:#9B2C2C}.btn.org{background:#E07B24;color:#fff}
.btn.sm{width:auto;padding:11px 16px;font-size:15px;margin:0;min-height:44px}
.h2{font-size:15px;font-weight:700;margin:4px 0 10px;color:var(--navy);display:flex;justify-content:space-between;align-items:center}
label.f{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
.inp{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:12px 0;font-size:15px}
.seg button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end}
.sheet{background:#fff;width:100%;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 8px;font-size:18px}
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:30;display:flex;align-items:center;justify-content:center;padding:20px}
.dlg .box{background:#fff;border-radius:16px;padding:18px;width:100%;max-width:420px}
.dlg .msg{white-space:pre-wrap;line-height:1.5;font-size:15px}
.dlg .bt{display:flex;gap:8px;margin-top:14px}
.dlg .bt .btn{margin:0}
.banner{background:#FFF5E6;border:1px solid #F6AD55;color:#7B341E;border-radius:12px;padding:12px;margin-bottom:10px;font-size:14px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#2D3748;color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;z-index:40;max-width:90%}
.lock{position:fixed;inset:0;background:var(--navy);color:#fff;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.dots{display:flex;gap:14px;margin:18px 0 8px}.dots i{width:16px;height:16px;border-radius:50%;border:2px solid #fff}.dots i.on{background:#fff}
.keys{display:grid;grid-template-columns:repeat(3,76px);gap:14px;margin-top:16px}
.keys button{height:76px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:26px}
.lock .err{color:#FEB2B2;min-height:22px;font-size:14px;text-align:center}
.muted{color:var(--muted);font-size:14px}
.kv{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px}
.empty{text-align:center;color:var(--muted);padding:30px 0}
.quick{display:flex;gap:6px;margin-top:6px}.quick button{flex:1;border:1px solid var(--line);background:#fff;border-radius:8px;padding:10px 0;min-height:44px;font-size:14px}
</style>
</head>
<body>
<div id="lock" class="lock hidden">
  <div style="font-size:13px;opacity:.75">인원현황 관리표</div>
  <h2 id="lockTitle" style="margin:6px 0 0">비밀번호 4자리</h2>
  <div class="dots" id="dots"><i></i><i></i><i></i><i></i></div>
  <div class="err" id="lockErr"></div>
  <div class="keys" id="keys"></div>
  <button id="lockCancel" class="btn sm hidden" data-act="cancelPin" style="margin-top:18px;background:rgba(255,255,255,.15);color:#fff">취소</button>
</div>

<header class="top" id="hdr"><div class="sub" id="company">경주법주</div><h1 id="title">인원현황 관리표</h1></header>
<main id="view"></main>

<nav class="bottom" id="nav">
  <button data-go="home" class="on"><i>🏠</i>홈</button>
  <button data-go="records"><i>📋</i>기록</button>
  <button data-act="addRecord" class="fab" id="fab"><i>＋</i>기록 추가</button>
  <button data-go="people"><i>👥</i>명단</button>
  <button data-go="settings"><i>⚙</i>설정</button>
</nav>
<div id="modals"></div>

<script>
"use strict";
/* ============================================================== 기본값 */
const APP_VERSION = "0.1.2", SCHEMA_VERSION = 1, DB_NAME = "staff-leave-db";
const BACKUP_FORMAT = "personnel-attendance-backup";
const STORES = ["employees", "attendance", "leave_balances", "settings", "audit_logs"];
const TYPES = ["연차", "반차", "조퇴", "지각", "외출", "결근"];
const LEAVE_TYPES = { "연차": 1, "반차": 0.5 };
const TIME_TYPES = ["조퇴", "지각", "외출"];
const DEFAULT_CATS = ["현장직", "아르바이트"];
const LOCAL_ONLY = ["pinHash", "pinSalt", "pinFail", "pinLockUntil", "preRestoreSnapshot", "recoveryNeeded"];   // 백업에 넣지 않는 설정 (이 기기 전용)
const SETTING_KEYS = { company: "string", categories: "array", lastBackup: "string", firstUse: "string" };   // 백업 허용 설정
const WEEK = "일월화수목금토";

/* ============================================================== SHA-256 (외부 라이브러리 없이) */
function sha256(str) {
  const K = [0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,
    0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,
    0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
    0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,
    0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,
    0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  const bytes = new TextEncoder().encode(str);
  const l = bytes.length, withOne = l + 9, n = Math.ceil(withOne / 64) * 64;
  const m = new Uint8Array(n); m.set(bytes); m[l] = 0x80;
  const bits = l * 8, dv = new DataView(m.buffer);
  dv.setUint32(n - 8, Math.floor(bits / 0x100000000)); dv.setUint32(n - 4, bits >>> 0);
  let H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const W = new Uint32Array(64);
  const r = (x, s) => (x >>> s) | (x << (32 - s));
  for (let o = 0; o < n; o += 64) {
    for (let i = 0; i < 16; i++) W[i] = dv.getUint32(o + i * 4);
    for (let i = 16; i < 64; i++) {
      const s0 = r(W[i-15],7) ^ r(W[i-15],18) ^ (W[i-15] >>> 3), s1 = r(W[i-2],17) ^ r(W[i-2],19) ^ (W[i-2] >>> 10);
      W[i] = (W[i-16] + s0 + W[i-7] + s1) >>> 0;
    }
    let [a,b,c,d,e,f,g,h] = H;
    for (let i = 0; i < 64; i++) {
      const S1 = r(e,6) ^ r(e,11) ^ r(e,25), ch = (e & f) ^ (~e & g), t1 = (h + S1 + ch + K[i] + W[i]) >>> 0;
      const S0 = r(a,2) ^ r(a,13) ^ r(a,22), mj = (a & b) ^ (a & c) ^ (b & c), t2 = (S0 + mj) >>> 0;
      h = g; g = f; f = e; e = (d + t1) >>> 0; d = c; c = b; b = a; a = (t1 + t2) >>> 0;
    }
    H = H.map((v, i) => (v + [a,b,c,d,e,f,g,h][i]) >>> 0);
  }
  return H.map(v => v.toString(16).padStart(8, "0")).join("");
}

/* ============================================================== 날짜 (문자열 YYYY-MM-DD, 시차 영향 없음) */
const pad = n => String(n).padStart(2, "0");
function todayStr() { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function isDate(s) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(s || "")) return false;
  const [y, m, d] = s.split("-").map(Number), t = new Date(y, m - 1, d);
  return t.getFullYear() === y && t.getMonth() === m - 1 && t.getDate() === d;
}
function normDate(s) {
  s = String(s || "").trim().replace(/[./]/g, "-").replace(/\s/g, "");
  const m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if (!m) return "";
  const r = `${m[1]}-${pad(m[2])}-${pad(m[3])}`;
  return isDate(r) ? r : "";
}
function dow(s) { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d).getDay(); }
function dayLabel(s) { const w = dow(s); return `<span class="${w === 6 ? "sat" : w === 0 ? "sun" : ""}">${s.slice(2).replace(/-/g, ".")}(${WEEK[w]})</span>`; }
function periodOf(s) { const y = +s.slice(0, 4), start = s.slice(5) >= "07-01" ? y : y - 1; return { start: `${start}-07-01`, end: `${start + 1}-06-30`, label: `${start}.7.1 ~ ${start + 1}.6.30` }; }
function shiftPeriod(p, k) { return periodOf(`${+p.start.slice(0, 4) + k}-07-01`); }
function yearsServed(hire, on) {
  if (!isDate(hire) || !isDate(on)) return null;
  const [hy, hm, hd] = hire.split("-").map(Number), [oy, om, od] = on.split("-").map(Number);
  let n = oy - hy; if (om < hm || (om === hm && od < hd)) n--; return Math.max(0, n);
}
function nowISO() { const d = new Date(), o = -d.getTimezoneOffset(), s = o >= 0 ? "+" : "-";
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}${s}${pad(Math.floor(Math.abs(o)/60))}:${pad(Math.abs(o)%60)}`; }
function uuid() {
  if (crypto && crypto.randomUUID) return crypto.randomUUID();
  const b = crypto.getRandomValues(new Uint8Array(16)); b[6] = (b[6] & 15) | 64; b[8] = (b[8] & 63) | 128;
  const h = [...b].map(x => x.toString(16).padStart(2, "0")).join("");
  return `${h.slice(0,8)}-${h.slice(8,12)}-${h.slice(12,16)}-${h.slice(16,20)}-${h.slice(20)}`;
}
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmtN = v => v == null ? "-" : (Math.round(v * 100) / 100).toString();
const fmtMin = m => !m ? "0분" : (m >= 60 ? `${Math.floor(m / 60)}시간${m % 60 ? " " + (m % 60) + "분" : ""}` : `${m}분`);

/* ============================================================== IndexedDB */
let DB = null;
function openDB() {
  return new Promise((res, rej) => {
    const rq = indexedDB.open(DB_NAME, 1);
    rq.onupgradeneeded = () => {
      const d = rq.result;
      if (!d.objectStoreNames.contains("employees")) d.createObjectStore("employees", { keyPath: "id" });
      if (!d.objectStoreNames.contains("attendance")) d.createObjectStore("attendance", { keyPath: "id" }).createIndex("employeeId", "employeeId");
      if (!d.objectStoreNames.contains("leave_balances")) d.createObjectStore("leave_balances", { keyPath: "id" }).createIndex("employeeId", "employeeId");
      if (!d.objectStoreNames.contains("settings")) d.createObjectStore("settings", { keyPath: "key" });
      if (!d.objectStoreNames.contains("audit_logs")) d.createObjectStore("audit_logs", { keyPath: "id" });
    };
    rq.onsuccess = () => res(rq.result);
    rq.onerror = () => rej(rq.error);
  });
}
function reqP(r) { return new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function all(store) { return reqP(DB.transaction(store).objectStore(store).getAll()); }
async function getS(key, def = null) { const r = await reqP(DB.transaction("settings").objectStore("settings").get(key)); return r ? r.value : def; }
/** 여러 저장소 쓰기를 한 트랜잭션으로 (하나라도 실패하면 전부 취소) + 감사기록 */
function write(ops, action = "", opt = {}) {
  if (S.recovery && !opt.force && !ops.every(o => o.store === "settings")) {
    toast("복구가 필요한 상태라 저장을 막았습니다 (설정 → 복구)");
    return Promise.reject(Object.assign(new Error("복구 필요 - 저장 제한"), { blocked: true }));
  }
  return new Promise((res, rej) => {
    const names = [...new Set(ops.map(o => o.store).concat(["audit_logs"]))];
    const t = DB.transaction(names, "readwrite");
    let firstErr = null;                                  // 처음 실패한 요청의 원인 (트랜잭션 최종 상태로 판정)
    t.oncomplete = () => res(true);
    t.onerror = ev => { if (!firstErr) firstErr = (ev.target && ev.target.error) || t.error; };
    t.onabort = () => { const er = firstErr || t.error || new Error("저장 취소 (전부 되돌림)"); logLocalError("저장", er); rej(er); };
    for (const o of ops) {
      const st = t.objectStore(o.store);
      const rq = o.op === "delete" ? st.delete(o.key) : st.put(o.value);
      rq.onerror = () => { if (!firstErr) firstErr = rq.error; };
      if (window.__failWriteAt >= 0 && ops.indexOf(o) === window.__failWriteAt) { firstErr = new Error("저장 실패 (시험)"); t.abort(); return; }   // 시험용 고장 주입
      if (o.store !== "settings" || !LOCAL_ONLY.includes(o.value && o.value.key)) {
        if (o.store !== "settings")
          t.objectStore("audit_logs").put({ id: uuid(), action: action || (o.op === "delete" ? "삭제" : "저장"), store: o.store,
            targetId: o.key || (o.value && (o.value.id || o.value.key)), before: o.before ?? null,
            after: o.op === "delete" ? null : o.value, timestamp: nowISO() });
      }
    }
  });
}
function logLocalError(where, er) { try { console.warn(`[인원현황] ${where} 실패:`, er && (er.name + " " + er.message)); window.__lastError = { where, name: er && er.name, message: er && er.message, at: nowISO() }; } catch (_) {} }
async function setS(key, value) { return write([{ store: "settings", op: "put", value: { key, value } }], "설정"); }

/* ============================================================== 상태 · 계산 */
const S = { view: "home", period: periodOf(todayStr()), q: "", cat: "전체", gender: "전체", showQuit: false,
  emps: [], recs: [], bals: [], cats: DEFAULT_CATS.slice(), company: "경주법주", detail: null, recType: "전체" };

async function load() {
  [S.emps, S.recs, S.bals] = await Promise.all([all("employees"), all("attendance"), all("leave_balances")]);
  S.cats = await getS("categories", DEFAULT_CATS.slice());
  S.company = await getS("company", "경주법주");
  S.lastBackup = await getS("lastBackup", null);
  S.firstUse = await getS("firstUse", null);
  S.hasUndo = !!(await getS("preRestoreSnapshot", null));
  S.recovery = await getS("recoveryNeeded", null);
  if (!S.firstUse) { S.firstUse = todayStr(); await setS("firstUse", S.firstUse); }
  S.emps.sort((a, b) => a.name.localeCompare(b.name, "ko"));
}
/** 법정 기준 참고값 (1년 이상 · 자동 계산 대상만). 1년 미만 · 아르바이트 · 직접 입력 지정 → 직접 입력 */
function legalRef(e, period) {
  if (e.leaveMode === "manual") return { days: null, years: null, note: "직접 입력 대상" };
  if (!e.hireDate) return { days: null, years: null, note: "입사일 없음" };
  const Y = yearsServed(e.hireDate, period.start);
  if (Y == null) return { days: null, years: null, note: "입사일 오류 · 직접 입력" };
  if (Y < 1) return { days: null, years: Y, note: "입사 1년 미만 · 직접 입력" };
  return { days: Math.min(25, 15 + Math.floor((Y - 1) / 2)), years: Y, note: `${Y}년 근속 기준` };
}
function balanceRow(e, period) { return S.bals.find(b => b.employeeId === e.id && b.periodStart === period.start) || null; }
function summary(e, period, recs = S.recs) {
  const ref = legalRef(e, period), b = balanceRow(e, period);
  const mine = recs.filter(r => r.employeeId === e.id && r.date >= period.start && r.date <= period.end);
  const used = mine.reduce((s, r) => s + (LEAVE_TYPES[r.type] ? (r.units ?? LEAVE_TYPES[r.type]) : 0), 0);
  const total = b && b.overrideDays != null ? b.overrideDays : ref.days;
  const src = b && b.overrideDays != null ? "확정" : ref.days != null ? "참고값" : "미입력";
  const cnt = t => mine.filter(r => r.type === t).length, mins = t => mine.filter(r => r.type === t).reduce((s, r) => s + (r.minutes || 0), 0);
  return { ref, total, src, used, remain: total == null ? null : Math.round((total - used) * 100) / 100,
    early: cnt("조퇴"), earlyMin: mins("조퇴"), late: cnt("지각"), lateMin: mins("지각"), out: cnt("외출"), outMin: mins("외출"),
    absent: cnt("결근"), records: mine.sort((a, b) => b.date.localeCompare(a.date) || (b.createdAt || "").localeCompare(a.createdAt || "")) };
}

    d.addEventListener("click", ev => { const b = ev.target.closest("[data-r]"); if (b) { d.remove(); res(b.dataset.r === "1"); } });
    document.body.appendChild(d);

}

function backupBanner() {

async function saveEmp(id) {
  const name = $("#eName").value.trim();
  if (!name) return toast("이름을 입력하세요");
  const hire = $("#eHire").value;
  if (hire && !isDate(hire)) return toast("입사일이 올바르지 않습니다");
  const before = S.emps.find(x => x.id === id) || null;
  const e = Object.assign({}, before || { id: uuid(), createdAt: nowISO(), status: "재직" }, {
    name, category: segVal("#eCat") || "현장직", gender: segVal("#eGender"), hireDate: hire, leaveMode: segVal("#eMode") || "auto",
    memo: $("#eMemo").value.trim(), updatedAt: nowISO() });
  if (id) { e.status = segVal("#eStatus") || "재직"; e.terminationDate = $("#eQuit").value || ""; if (e.status === "퇴사" && !e.terminationDate) return toast("퇴사일을 입력하세요"); if (e.status === "재직") e.terminationDate = "";
    if (e.hireDate && e.terminationDate && e.terminationDate < e.hireDate) return toast("퇴사일이 입사일보다 빠릅니다"); }
  if (!id && S.emps.some(x => x.name === name && x.status !== "퇴사")) {
    if (!(await ask(`같은 이름 '${name}' 직원이 이미 있습니다.\n다른 사람이면 그대로 추가합니다 (별도 번호로 구분).`, "추가"))) return;
  }
  await write([{ store: "employees", op: "put", value: e, before }], id ? "직원 수정" : "직원 추가");
  await load(); closeSheet(); render(); toast("저장했습니다");
}

function stamp() { const d = new Date(); return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}`; }

    STORES.forEach(n => { const rq = t.objectStore(n).getAll(); rq.onsuccess = () => { out[n] = rq.result; }; });

/** 백업 파일 검사 → { ok, why, backup } · 체크섬은 손상 확인용이므로 내용(필드·형식·범위·중복)도 모두 검사 */

const csvCell = v => { const s = String(v ?? ""); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
const toCSV = rows => "﻿" + rows.map(r => r.map(csvCell).join(",")).join("\r\n");
function parseCSV(text) {

  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch; }
    else if (ch === '"') q = true;
    else if (ch === ",") { row.push(cell); cell = ""; }
    else if (ch === "\n" || ch === "\r") { if (ch === "\r" && text[i + 1] === "\n") i++; row.push(cell); rows.push(row); row = []; cell = ""; }
    else cell += ch;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(c => c.trim()));
}
function summaryCSV() {
  const rows = [["집계기간", "이름", "구분", "성별", "입사일", "상태", "총연차", "총연차구분", "사용", "잔여", "조퇴(회)", "조퇴(분)", "지각(회)", "지각(분)", "외출(회)", "외출(분)", "결근(일)"]];

/** 명단 CSV → { add, dup(정확히 같음: 건너뜀), similar(이름·구분 같고 입사일 다름/없음: 확인 후 추가), bad } */
function planRoster(text) {
  const rows = parseCSV(text); if (!rows.length) return { add: [], dup: [], similar: [], bad: ["빈 파일"] };
  const h = rows[0].map(x => x.trim()), ix = k => h.indexOf(k);
  if (ix("이름") < 0) return { add: [], dup: [], similar: [], bad: ["첫 줄에 '이름' 제목이 없습니다 (양식 받기 참고)"] };
  const add = [], dup = [], similar = [], bad = [];
  const exact = new Set(S.emps.map(e => `${e.name}|${e.category}|${e.hireDate || ""}`));
  const nameCat = new Set(S.emps.map(e => `${e.name}|${e.category}`));
  rows.slice(1).forEach((r, i) => {
    const name = (r[ix("이름")] || "").trim(); if (!name) return;
    if (name.length > 50) { bad.push(`${i + 2}행: 이름이 너무 깁니다`); return; }
    const cat = (ix("구분") >= 0 ? r[ix("구분")] : "").trim() || "현장직";
    const rawG = (ix("성별") >= 0 ? r[ix("성별")] : "").trim();
    const g = { "남": "남", "남자": "남", "남성": "남", "M": "남", "여": "여", "여자": "여", "여성": "여", "F": "여", "": "" }[rawG];
    if (g === undefined) { bad.push(`${i + 2}행 ${name}: 성별 '${rawG}' (남·여만 가능)`); return; }
    const rawD = ix("입사일") >= 0 ? (r[ix("입사일")] || "").trim() : "", d = normDate(rawD);
    if (rawD && !d) { bad.push(`${i + 2}행 ${name}: 입사일 '${rawD}' 형식 오류`); return; }
    const k = `${name}|${cat}|${d}`, nc = `${name}|${cat}`;
    const emp = { id: uuid(), name, category: cat, gender: g, hireDate: d, status: "재직", leaveMode: cat === "아르바이트" ? "manual" : "auto",
      memo: "", createdAt: nowISO(), updatedAt: nowISO() };
    if (exact.has(k)) { dup.push(`${name} (${cat}${d ? " · " + d : ""})`); return; }
    if (nameCat.has(nc)) similar.push(emp); else add.push(emp);
    exact.add(k); nameCat.add(nc);

}
async function importRoster(text) {
  const p = planRoster(text);
  const msg = `추가 ${p.add.length}명${p.dup.length ? `\n똑같은 직원이라 건너뜀 ${p.dup.length}명: ${p.dup.slice(0, 8).join(", ")}${p.dup.length > 8 ? " …" : ""}` : ""}` +
    `${p.similar.length ? `\n확인 필요 ${p.similar.length}명 (이름·구분 같고 입사일 다름): ${p.similar.slice(0, 6).map(e => e.name).join(", ")}` : ""}` +
    `${p.bad.length ? `\n오류 ${p.bad.length}건: ${p.bad.slice(0, 5).join(" / ")}` : ""}`;
  if (!p.add.length && !p.similar.length) { await ask(`추가할 직원이 없습니다.\n${msg}`, "확인", ""); return p; }
  if (p.add.length) { if (!(await ask(`명단 CSV\n${msg}\n\n새 직원 ${p.add.length}명을 추가할까요?`, "추가"))) return p; }
  if (p.similar.length && await ask(`이름·구분이 같은 직원이 이미 있습니다 (입사일 다름):\n${p.similar.map(e => `${e.name} ${e.hireDate || "(입사일 없음)"}`).join("\n")}\n\n다른 사람이면 추가하세요.`, "다른 사람 · 추가", "건너뜀"))
    p.add = p.add.concat(p.similar);

  await load(); render(); toast(`${p.add.length}명 추가`); return p;
}

async function pinKeyInner(k) {

    if (pinFirst !== v) { pinFirst = ""; $("#lockTitle").textContent = "새 비밀번호 4자리"; $("#lockErr").textContent = "두 번 입력이 다릅니다"; showDots(); return; }

    await write([{ store: "settings", op: "put", value: { key: "pinSalt", value: salt } }, { store: "settings", op: "put", value: { key: "pinHash", value: sha256(salt + v) } },
      { store: "settings", op: "put", value: { key: "pinFail", value: 0 } }], "비밀번호");
    if ((await getS("pinHash")) !== sha256(salt + v)) { $("#lockErr").textContent = "저장 실패 - 다시 입력하세요"; pinFirst = ""; return; }

  const g = ev.target.closest("[data-go]"); if (g) { S.q = ""; return go(g.dataset.go); }
  const a = ev.target.closest("[data-act]"); if (!a) return;
  const id = a.dataset.id, v = a.dataset.v;
  switch (a.dataset.act) {
    case "open": return go("detail", { detail: id });
    case "back": return go("home");
    case "cat": S.cat = v; return render();
    case "gender": S.gender = v; return render();
    case "recType": S.recType = v; return render();
    case "pPrev": S.period = shiftPeriod(S.period, -1); return render();
    case "pNext": S.period = shiftPeriod(S.period, 1); return render();
    case "toggleQuit": S.showQuit = !S.showQuit; return render();
    case "editEmp": return empForm(id);
    case "saveEmp": return saveEmp(id);
    case "editTotal": return totalForm(id);
    case "saveTotal": return saveTotal(id);
    case "clearTotal": return saveTotal(id, true);
    case "addRecord": return recForm(null, id || (S.view === "detail" ? S.detail : ""));
    case "editRec": return recForm(id);
    case "saveRec": return saveRec(id);
    case "delRec": return delRec(id);
    case "close": return closeSheet();
    case "backup": return doBackup();
    case "restore": { const t = await pickFile(".json,application/json"); if (t) await restoreFromText(t); return; }
    case "csvSummary": download(`인원현황_집계_${S.period.start.slice(0, 4)}_${stamp()}.csv`, summaryCSV(), "text/csv"); return toast("집계표 CSV 저장");
    case "csvRecords": download(`인원현황_기록_${stamp()}.csv`, recordsCSV(), "text/csv"); return toast("기록 CSV 저장");
    case "csvTemplate": download("인원현황_명단양식.csv", toCSV([["이름", "구분", "성별", "입사일"], ["홍길동", "현장직", "남", "2020-03-02"], ["김영희", "아르바이트", "여", "2026-05-11"]]), "text/csv"); return;
    case "csvImport": { const t = await pickFile(".csv,text/csv"); if (t) await importRoster(t); return; }
    case "saveBasic": {
      const cats = $("#setCats").value.split(",").map(x => x.trim()).filter(Boolean);
      for (const c of S.emps.map(e => e.category)) if (!cats.includes(c)) cats.push(c);
      await setS("company", $("#setCompany").value.trim() || "경주법주"); await setS("categories", cats.length ? cats : DEFAULT_CATS);
      await load(); render(); return toast("저장했습니다");
    }
    case "changePin": return showLock("verify");
    case "cancelPin": $("#lock").classList.add("hidden"); $("#lockCancel").classList.add("hidden"); return;
    case "undoRestore": return undoRestore();
    case "audit": {
      const logs = (await all("audit_logs")).sort((x, y) => y.timestamp.localeCompare(x.timestamp)).slice(0, 60);
      return sheet(`<h3>수정 이력 (최근 60건)</h3>${logs.map(l => `<div class="kv"><span>${l.timestamp.slice(0, 16).replace("T", " ")}</span><b>${esc(l.action)}${l.after && l.after.name ? " · " + esc(l.after.name) : l.after && l.after.date ? " · " + l.after.date + " " + (l.after.type || "") : ""}</b></div>`).join("") || "<div class='empty'>없음</div>"}<button class="btn" data-act="close">닫기</button>`);
    }
  }
}
document.addEventListener("input", ev => { if (ev.target.id === "q") { S.q = ev.target.value; const pos = ev.target.selectionStart; render(); const q = $("#q"); if (q) { q.focus(); q.setSelectionRange(pos, pos); } } });

/* ============================================================== 시작 */
async function start() {
  keypad();
  try { DB = await openDB(); }
  catch (ex) { $("#view").innerHTML = `<div class="banner">이 브라우저에서 저장소를 열 수 없습니다.\n크롬으로 여세요.\n(${esc(ex && ex.message)})</div>`; return; }
  if (navigator.storage && navigator.storage.persist) {
    navigator.storage.persist().then(p => { S.persisted = p; const el = $("#persist"); if (el) el.textContent = p ? "켜짐 (자동 삭제 안 됨)" : "기본"; }).catch(() => {});
  }
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(() => {});
  const hash = await getS("pinHash");
  await showLock(hash ? "check" : "set");      // 비밀번호를 정하거나 맞히기 전에는 자료를 읽지 않음
  const obs = new MutationObserver(() => { const el = $("#persist"); if (el && S.persisted != null) el.textContent = S.persisted ? "켜짐 (자동 삭제 안 됨)" : "기본"; });
  obs.observe($("#view"), { childList: true });
}
// 시험용 (화면 조작 없이 계산 확인) - 자료에는 영향 없음
window.APP = { S, sha256, periodOf, yearsServed, legalRef, summary, validateBackup, buildBackup, planRoster, restoreFromText, snapshot, verifyAgainst, undoRestore, rollbackTo, enterRecovery,
  importRoster, load, render, all, getS, write, uuid, recordsCSV, summaryCSV, replaceAll, version: APP_VERSION };
start();
</script>
